name: Deploy Magora Store to cPanel

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3. Install Monorepo Dependencies
        run: |
          npm install

      - name: 4. Build Next.js & Fastify Apps
        env:
          NODE_ENV: production
          JWT_SECRET: c8d4f9b2a1e76543089dcbafe1234567890abcdef1234567890abcdef1234567
          WEB_REVALIDATE_SECRET: c8d4f9b2a1e76543089dcbafe1234567890abcdef1234567890abcdef1234567
          CORS_ORIGINS: https://new.officialhayafoundation.com
          PUBLIC_API_URL: https://new.officialhayafoundation.com/api/v1
          API_URL: http://127.0.0.1:4000/api/v1
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_SITE_URL: https://new.officialhayafoundation.com
        run: |
          npm run build

      - name: 5. Prepare Staging Release Bundle
        run: |
          node scripts/prepare-staging.mjs
          tar -czf magora-release.tar.gz -C staging .

      - name: 6. Upload Release Archive to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "magora-release.tar.gz"
          target: ${{ secrets.SSH_TARGET_DIR || '/home/officialhayafoun/new.officialhayafoundation.com' }}

      - name: 7. Extract Release & Reload Passenger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            TARGET="${{ secrets.SSH_TARGET_DIR || '/home/officialhayafoun/new.officialhayafoundation.com' }}"
            cd "$TARGET"
            
            # 1. Activate CloudLinux virtual environment (critical so node & npm are in PATH)
            if [ -f /home/officialhayafoun/nodevenv/new.officialhayafoundation.com/20/bin/activate ]; then
              source /home/officialhayafoun/nodevenv/new.officialhayafoundation.com/20/bin/activate
            fi
            
            echo "📦 Extracting release archive..."
            tar -xzf magora-release.tar.gz
            rm -f magora-release.tar.gz
            
            echo "📁 Ensuring persistent storage directories exist..."
            mkdir -p apps/api/data apps/api/uploads apps/api/backups tmp
            
            echo "📦 Installing production dependencies..."
            npm install --omit=dev --no-audit --prefer-offline || npm install
            
            echo "🌱 Seeding initial MySQL data (idempotent safe)..."
            if [ -f apps/api/dist/seed.js ]; then
              node apps/api/dist/seed.js || true
              node apps/api/dist/seed-reviews.js || true
            else
              npm run db:seed -w @magora/api || true
              npm run db:reviews -w @magora/api || true
            fi
            
            echo "🔒 Setting production permissions..."
            chmod -R 755 .
            chmod -R 777 apps/api/uploads apps/api/backups
            
            echo "🔄 Gracefully restarting Fastify & Phusion Passenger..."
            pkill -f 'dist/server.js' || pkill -f 'src/server.ts' || true
            touch tmp/restart.txt
            
            echo "✅ Deployment successful! Magora Store is LIVE."
